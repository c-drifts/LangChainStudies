[project]
name = "langchaintest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "c-drifts", email = "drifts282@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.7.2",
    "openai>=3.36.1",
    "pydantic>=2.14.1",
    "pypdf>=6.21.4",
    "wikipedia>=1.4.0",
]

[project.scripts]
langchaintest = "langchaintest:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
